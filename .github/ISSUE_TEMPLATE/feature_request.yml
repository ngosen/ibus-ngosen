name: Yêu cầu tính năng
description: Đề xuất tính năng hoặc gói cài còn thiếu cho Ngó Sen cho GNOME.
labels: ['tính năng']
body:
  - type: markdown
    attributes:
      value: |
        Tìm trong [các yêu cầu đã có](https://github.com/ngosen/ibus-ngosen/issues?q=label%3A%22t%C3%ADnh+n%C4%83ng%22) trước; yêu cầu gói cài cho distro hoặc CPU chưa được hỗ trợ cũng gửi ở đây.
        Bản IBus giữ gọn những gì IBus và GNOME hỗ trợ. Cứu chữ, Cứu dấu, chế độ riêng theo từng app hay chèn emoji đã có ở [bản fcitx5](https://github.com/ngosen/ngosen).

  - type: textarea
    id: problem
    attributes:
      label: Bạn muốn làm gì, và đang vướng ở đâu?
      placeholder: Khi nhập password trong terminal, tôi phải tự tắt tiếng Việt rồi bật lại sau đó.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Bạn muốn Ngó Sen hoạt động thế nào?
      description: Mô tả phím bấm, menu hoặc setting bạn muốn có.
    validations:
      required: true

  - type: input
    id: apps
    attributes:
      label: App hoặc desktop liên quan
      placeholder: VS Code, GNOME, Xfce, ...

  - type: textarea
    id: reference
    attributes:
      label: Bộ gõ hoặc app đã làm được việc này
      description: Ghi tên, link hoặc ảnh chụp màn hình.

  - type: textarea
    id: additional
    attributes:
      label: Thông tin thêm
