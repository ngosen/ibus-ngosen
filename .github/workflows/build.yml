name: CI
on:
  push:
    branches: [main, next, patch]
    tags: ['*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  clang-format:
    name: Check clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: clang-format
        run: git ls-files '*.c' '*.cpp' '*.h' | xargs -r clang-format --dry-run --Werror

  python:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: 'check settings misc'
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: 'format --check settings misc'

  new-names:
    name: Check new names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: misc/check-new-names.sh

  # A release ships only typing logic that fcitx5-ngosen users already have. Branches may pin an
  # untagged commit while the core change waits for its release.
  core-tag:
    name: Typing logic is a released tag
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: misc/check-core-tag.sh

  build:
    name: Build and test (${{ matrix.image }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported GNOME (46); a new enough Rust comes only as versioned packages.
          - image: ubuntu:24.04
            packages: g++ cmake make git ca-certificates pkg-config libibus-1.0-dev cargo-1.91 rustc-1.91
            path: /usr/lib/rust-1.91/bin
          - image: ubuntu:26.04
            packages: g++ cmake make git ca-certificates pkg-config libibus-1.0-dev cargo rustc
          # Debian 13's own Rust is 1.85; rustc-web carries a newer one.
          - image: debian:13
            packages: g++ cmake make git ca-certificates pkg-config libibus-1.0-dev cargo-web rustc-web
          - image: fedora:44
            packages: gcc-c++ cmake make git pkgconf-pkg-config ibus-devel cargo rust
    steps:
      # The engine tests run a private ibus-daemon and talk to it from Python; the settings window
      # tests build the window on an Xvfb display.
      - name: Install dependencies
        run: |
          if command -v dnf > /dev/null; then
            dnf install -y ${{ matrix.packages }} ibus python3-gobject dbus-daemon \
              gettext desktop-file-utils appstream gtk4 libadwaita xorg-x11-server-Xvfb
          else
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ${{ matrix.packages }} \
              ibus dbus python3-gi gir1.2-ibus-1.0 \
              gettext desktop-file-utils appstream gir1.2-gtk-4.0 gir1.2-adw-1 xvfb xauth
          fi
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Build
        run: |
          export PATH="${{ matrix.path }}:$PATH"
          rustc --version
          pkg-config --modversion ibus-1.0
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
      - name: Test
        env:
          NGOSEN_WINDOW_TESTS: required
        run: ctest --test-dir build --output-on-failure --no-tests=error -j"$(nproc)"
