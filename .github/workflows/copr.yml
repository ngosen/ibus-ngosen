name: Fedora COPR

# Built on publish, not on tag push, so dnf users get a release only after its draft was checked.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copr:
    name: Build in nguyenphi/ngosen
    if: startsWith(github.ref, 'refs/tags/ibus-ngosen-') && !github.event.release.prerelease
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          pipx install copr-cli==2.6

      # The release tarball carries the ngosen submodule and the vendored crates; COPR builds offline.
      - name: Build the source package
        env:
          GH_TOKEN: ${{ github.token }}
        run: packaging/copr-srpm.sh "$GITHUB_REF_NAME" srpm

      - name: Write COPR credentials
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          install -d -m 700 ~/.config
          printf '%s\n' "$COPR_CONFIG" > ~/.config/copr
          chmod 600 ~/.config/copr

      # Waits for every chroot, so a failed Fedora build fails this run.
      - name: Build in COPR
        run: copr-cli build nguyenphi/ngosen srpm/*.src.rpm
